<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1008" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Mapa mental: Remoção de elementos</title>
<desc id="d">Tema central Remoção de elementos, ligado a conceitos principais, exemplos, aplicações e conclusão.</desc>
<rect width="1560" height="1008" rx="16" fill="#121212"/>
<path d="M620,514 C565.0,514 565.0,76 510,76" fill="none" stroke="#ff6a00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M940,514 C995.0,514 995.0,76 1050,76" fill="none" stroke="#ff6a00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M940,514 C995.0,514 995.0,590 1050,590" fill="none" stroke="#ff6a00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M620,514 C565.0,514 565.0,590 510,590" fill="none" stroke="#ff6a00" stroke-width="2.5" stroke-linecap="round"/>
<rect x="30" y="50" width="480" height="52" rx="12" fill="#171717" stroke="#ff6a00" stroke-width="1.5"/>
<circle cx="60" cy="76" r="13" fill="#ff6a00"/>
<text x="60" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#121212">1</text>
<text x="88" y="83" font-size="19" font-weight="700" fill="#ff6a00">Conceitos principais</text>
<line x1="44" y1="102" x2="44" y2="434.0" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="44" y1="154.0" x2="60" y2="154.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="124" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="149" font-size="14" fill="#f5f5f5">Retirar um elemento de uma lista ou</text>
<text x="76" y="169" font-size="14" fill="#f5f5f5">vetor, diminuindo o seu tamanho</text>
<line x1="44" y1="224.0" x2="60" y2="224.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="194" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="219" font-size="14"><tspan font-weight="600" fill="#ff6a00">Por posição:</tspan><tspan fill="#f5f5f5"> usa o índice do elemento</tspan></text>
<text x="76" y="239" font-size="14" fill="#f5f5f5">(ex.: remover o 3º item)</text>
<line x1="44" y1="294.0" x2="60" y2="294.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="264" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="289" font-size="14"><tspan font-weight="600" fill="#ff6a00">Por valor:</tspan><tspan fill="#f5f5f5"> procura o elemento e remove a</tspan></text>
<text x="76" y="309" font-size="14" fill="#f5f5f5">primeira ocorrência encontrada</text>
<line x1="44" y1="364.0" x2="60" y2="364.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="334" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="359" font-size="14"><tspan font-weight="600" fill="#ff6a00">Deslocamento:</tspan><tspan fill="#f5f5f5"> os elementos seguintes voltam uma</tspan></text>
<text x="76" y="379" font-size="14" fill="#f5f5f5">posição para fechar o espaço</text>
<line x1="44" y1="434.0" x2="60" y2="434.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="404" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="429" font-size="14"><tspan font-weight="600" fill="#ff6a00">Cuidado:</tspan><tspan fill="#f5f5f5"> tentar remover algo que não existe</tspan></text>
<text x="76" y="449" font-size="14" fill="#f5f5f5">gera erro no programa</text>
<rect x="1050" y="50" width="480" height="52" rx="12" fill="#171717" stroke="#ff6a00" stroke-width="1.5"/>
<circle cx="1080" cy="76" r="13" fill="#ff6a00"/>
<text x="1080" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#121212">2</text>
<text x="1108" y="83" font-size="19" font-weight="700" fill="#ff6a00">Exemplos</text>
<line x1="1064" y1="102" x2="1064" y2="394.0" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="1064" y1="154.0" x2="1080" y2="154.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="124" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="149" font-size="14"><tspan font-weight="600" fill="#ff6a00">Fila do banco:</tspan><tspan fill="#f5f5f5"> quem é atendido sai da fila e os</tspan></text>
<text x="1096" y="169" font-size="14" fill="#f5f5f5">demais avançam uma posição</text>
<line x1="1064" y1="224.0" x2="1080" y2="224.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="194" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="219" font-size="14"><tspan font-weight="600" fill="#ff6a00">Lista de compras:</tspan><tspan fill="#f5f5f5"> ao comprar um item, ele é riscado</tspan></text>
<text x="1096" y="239" font-size="14" fill="#f5f5f5">e sai da lista</text>
<line x1="1064" y1="284.0" x2="1080" y2="284.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="264" width="450" height="40" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="289" font-size="14" font-weight="600" fill="#ff6a00">Por valor:</text>
<text x="1096" y="309" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#f5f5f5">lista.remove("maçã")</text>
<line x1="1064" y1="334.0" x2="1080" y2="334.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="314" width="450" height="40" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="339" font-size="14" font-weight="600" fill="#ff6a00">Por posição:</text>
<text x="1096" y="359" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#f5f5f5">lista.pop(2)</text>
<line x1="1064" y1="394.0" x2="1080" y2="394.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="364" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="389" font-size="14"><tspan font-weight="600" fill="#ff6a00">Antes e depois:</tspan><tspan fill="#f5f5f5"> [10, 20, 30, 40] ao remover o 30</tspan></text>
<text x="1096" y="409" font-size="14" fill="#f5f5f5">vira [10, 20, 40]</text>
<rect x="1050" y="564" width="480" height="52" rx="12" fill="#171717" stroke="#ff6a00" stroke-width="1.5"/>
<circle cx="1080" cy="590" r="13" fill="#ff6a00"/>
<text x="1080" y="595" text-anchor="middle" font-size="15" font-weight="700" fill="#121212">3</text>
<text x="1108" y="597" font-size="19" font-weight="700" fill="#ff6a00">Aplicações</text>
<line x1="1064" y1="616" x2="1064" y2="928.0" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="1064" y1="668.0" x2="1080" y2="668.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="638" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="663" font-size="14"><tspan font-weight="600" fill="#ff6a00">Carrinho de compras:</tspan><tspan fill="#f5f5f5"> remover um produto escolhido</tspan></text>
<text x="1096" y="683" font-size="14" fill="#f5f5f5">pelo cliente</text>
<line x1="1064" y1="728.0" x2="1080" y2="728.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="708" width="450" height="40" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="733" font-size="14"><tspan font-weight="600" fill="#ff6a00">Lista de tarefas:</tspan><tspan fill="#f5f5f5"> apagar tarefas já concluídas</tspan></text>
<line x1="1064" y1="788.0" x2="1080" y2="788.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="758" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="783" font-size="14"><tspan font-weight="600" fill="#ff6a00">Cadastros:</tspan><tspan fill="#f5f5f5"> excluir um aluno, cliente ou</tspan></text>
<text x="1096" y="803" font-size="14" fill="#f5f5f5">funcionário do sistema</text>
<line x1="1064" y1="858.0" x2="1080" y2="858.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="828" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="853" font-size="14"><tspan font-weight="600" fill="#ff6a00">Filas e pilhas:</tspan><tspan fill="#f5f5f5"> retirar o primeiro ou o último</tspan></text>
<text x="1096" y="873" font-size="14" fill="#f5f5f5">elemento da estrutura</text>
<line x1="1064" y1="928.0" x2="1080" y2="928.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1080" y="898" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1096" y="923" font-size="14"><tspan font-weight="600" fill="#ff6a00">Limpeza de dados:</tspan><tspan fill="#f5f5f5"> eliminar valores repetidos ou</tspan></text>
<text x="1096" y="943" font-size="14" fill="#f5f5f5">inválidos de uma lista</text>
<rect x="30" y="564" width="480" height="52" rx="12" fill="#171717" stroke="#ff6a00" stroke-width="1.5"/>
<circle cx="60" cy="590" r="13" fill="#ff6a00"/>
<text x="60" y="595" text-anchor="middle" font-size="15" font-weight="700" fill="#121212">4</text>
<text x="88" y="597" font-size="19" font-weight="700" fill="#ff6a00">Conclusão</text>
<line x1="44" y1="616" x2="44" y2="858.0" stroke="#3a3a3a" stroke-width="1.5"/>
<line x1="44" y1="668.0" x2="60" y2="668.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="638" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="663" font-size="14" fill="#f5f5f5">Remover elementos mantém os dados</text>
<text x="76" y="683" font-size="14" fill="#f5f5f5">atualizados e organizados</text>
<line x1="44" y1="728.0" x2="60" y2="728.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="708" width="450" height="40" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="733" font-size="14"><tspan font-weight="600" fill="#ff6a00">Duas formas:</tspan><tspan fill="#f5f5f5"> por posição (índice) ou por valor</tspan></text>
<line x1="44" y1="788.0" x2="60" y2="788.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="758" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="783" font-size="14"><tspan font-weight="600" fill="#ff6a00">Atenção:</tspan><tspan fill="#f5f5f5"> o tamanho da lista diminui e os</tspan></text>
<text x="76" y="803" font-size="14" fill="#f5f5f5">índices dos elementos mudam</text>
<line x1="44" y1="858.0" x2="60" y2="858.0" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="60" y="828" width="450" height="60" rx="10" fill="#171717" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="76" y="853" font-size="14"><tspan font-weight="600" fill="#ff6a00">Boa prática:</tspan><tspan fill="#f5f5f5"> conferir se o elemento existe antes</tspan></text>
<text x="76" y="873" font-size="14" fill="#f5f5f5">de tentar removê-lo</text>
<rect x="620" y="459" width="320" height="110" rx="22" fill="#ff6a00"/>
<text x="780" y="512" text-anchor="middle" font-size="24" font-weight="700" fill="#121212">Remoção de elementos</text>
<text x="780" y="540" text-anchor="middle" font-size="13" fill="#121212">retirar itens de uma</text>
<text x="780" y="558" text-anchor="middle" font-size="13" fill="#121212">lista ou vetor</text>
</svg>